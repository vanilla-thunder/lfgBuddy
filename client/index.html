<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- CSP: sent as a response header by main.js (installContentSecurityPolicy),
       since it has to name the configured server. -->
  <title>LFG Buddy</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>

  <!-- Setup screen -->
  <div id="setup-screen" class="screen">
    <div class="setup-panel">
      <div class="logo">LFG Buddy</div>

      <label for="server-url">Server</label>
      <input type="text" id="server-url" placeholder="e.g. lfg.example.com" autocomplete="url" spellcheck="false">

      <label for="player-name">Your Name</label>
      <input type="text" id="player-name" placeholder="e.g. Ayres" autocomplete="nickname" spellcheck="false" maxlength="24">

      <label for="room-code">Room Code</label>
      <input type="text" id="room-code" placeholder="e.g. TEAM-ALPHA" autocomplete="off" spellcheck="false" style="text-transform:uppercase">

      <button class="connect-btn" id="connect-btn">Connect</button>
      <div class="status-bar" id="status-bar"></div>
    </div>
  </div>

  <!-- Overlay screen -->
  <div id="overlay-screen" class="screen hidden">
    <div class="overlay-panel">
      <div class="reconnect-banner hidden" id="reconnect-banner">Reconnecting…</div>

      <div id="timer"></div>
      <div class="activity-section" id="board-panel">
        <div id="ready-check" role="status"></div>
        <div id="video"></div>
        <div class="hidden" id="activity-picker-view">
          <div class="picker-bar">
            <label class="guided-toggle hidden" title="Guided mode — only admins can interact with the dashboard, areas and drawing while this is on">
              <input type="checkbox" class="guided-mode-checkbox" aria-label="Guided mode"><span class="guided-switch" aria-hidden="true"><span class="guided-knob">👑</span></span>
            </label>
          </div>
          <div class="activity-picker" id="activity-picker"></div>
        </div>

        <div id="activity-controls">
          <div class="encounter-nav">
            <button class="nav-btn" id="back-to-activities-btn" disabled>Back</button>
            <button class="nav-btn" id="encounter-reset-btn" disabled>Reset</button>
            <button class="nav-btn hidden" id="picture-btn" title="Replace this encounter's picture with one from a URL">🌐</button>
            <label class="guided-toggle hidden" title="Guided mode — only admins can interact with the dashboard, areas and drawing while this is on">
              <input type="checkbox" class="guided-mode-checkbox" aria-label="Guided mode"><span class="guided-switch" aria-hidden="true"><span class="guided-knob">👑</span></span>
            </label>
            <span class="encounter-label" id="encounter-label"></span>
            <button class="nav-btn" id="encounter-prev-btn" disabled>‹</button>
            <button class="nav-btn" id="encounter-next-btn" disabled>›</button>
          </div>

          <div class="board">
            <div class="draw-toolbar" id="draw-toolbar"></div>
            <div class="encounter-wrap" id="encounter-wrap">
              <img id="encounter-image" alt="">
              <div id="area-layer"></div>
              <canvas id="draw-canvas"></canvas>
            </div>
          </div>
          <div class="activity-hint">F8 - hide/show | lock/unlock - F9</div>
        </div>
      </div>

      <div class="panel-footer">
        <div class="admin-link-row hidden" id="admin-link-row">
          <button class="admin-link-btn" id="copy-admin-link-btn" title="Copy a link that makes another device of yours (e.g. your phone) an admin of this room — share it with no one else">Copy Admin Link</button>
          <button class="admin-link-btn" id="admin-qr-btn" title="Show the admin link as a QR code to scan with your phone">Admin QR</button>
          <button class="admin-link-btn" id="ready-check-btn" title="Ask everyone in the room whether they're ready">Ready Check</button>
          <button class="admin-link-btn" id="timer-btn" title="Start a timer everyone sees in sync">Timer</button>
          <button class="admin-link-btn" id="video-btn" title="Watch a YouTube video together, in sync">Video</button>
        </div>
        <button class="disconnect-btn" id="disconnect-btn">Leave Room</button>
      </div>
    </div>
  </div>

  <div id="icon-picker" class="icon-picker hidden"></div>

  <script src="../shared/drawing.js"></script>
  <script src="../shared/area-groups.js"></script>
  <script src="../shared/ready-check.js"></script>
  <script src="../shared/timer.js"></script>
  <script src="../shared/picture-dialog.js"></script>
  <script src="../shared/video.js"></script>
  <script src="../shared/vendor/qrcode-generator.js"></script>
  <script src="../shared/admin-qr.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
