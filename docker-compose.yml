services:

  lfg-buddy:
    build: ./server
    # Code is mounted, not copied (see server/Dockerfile): static files —
    # public/, shared/, activity images — are live as soon as they're
    # uploaded; changes to server/index.js or activities/*.js need a
    # `docker compose restart`. Read-only: the server never writes here.
    volumes:
      - ./server:/app/server:ro
      - ./shared:/app/shared:ro
    restart: unless-stopped
    environment:
      - PORT=3000
    # Domain and Traefik cert resolver come from .env (git-ignored; see
    # .env.example) — compose refuses to start without them.
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.lfg-buddy.rule=Host(`${LFG_HOST:?set LFG_HOST in .env}`)'
      - 'traefik.http.routers.lfg-buddy.tls.certresolver=${LFG_CERT_RESOLVER:?set LFG_CERT_RESOLVER in .env}'
      - 'traefik.http.services.lfg-buddy.loadbalancer.server.port=3000'

networks:
  default:
    name: web
    external: true
